            <ul>

            </ul>
        </nav>

    <main>
        <section class="contact-header">
            <h1>Contact & Commande</h1>
            <p>Veuillez remplir tous les champs pour nous transmettre votre demande.</p>
        </section>

        <section class="contact-container">
            <form action="#" method="POST" class="contact-form">

                <div class="form-group">
                    <label for="fullname">Nom complet</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="Ex: Jean Diop">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Adresse e-mail</label>
                        <input type="email" id="email" name="email" required placeholder="votre@email.com">
                    </div>

                    <div class="form-group">
                        <label for="phone">Numéro de téléphone</label>
                        <input type="tel" id="phone" name="phone" required placeholder="+221 ...">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="product">Produit souhaité</label>
                        <input type="text" id="product" name="product" required placeholder="Ex: Chemise Wax">
                    </div>

                    <div class="form-group">
                        <label for="size">Taille</label>
                        <select id="size" name="size" required>
                            <option value="">-- Choisir --</option>
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="color">Couleur préférée</label>
                        <input type="text" id="color" name="color" required placeholder="Ex: Jaune moutarde">
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required
                        placeholder="Détails de votre commande..."></textarea>
                </div>

                <button type="submit" class="btn-send">Envoyer</button>
            </form>
        </section>
    </main>
